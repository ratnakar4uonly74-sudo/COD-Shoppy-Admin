name: Build COD Shoppy Admin APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cod-shoppy-debug-key-v1

      - name: Create signing key if missing
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | grep -i SHA1

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug

      - name: Print APK signing SHA-1
        run: |
          AS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$AS" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-1"

      - name: Verify Google Web Client ID
        run: |
          MATCH=$(grep -R -n -A 2 --include='*.xml' 'default_web_client_id' app/build 2>/dev/null || true)
          if [ -z "$MATCH" ]; then
            echo "ERROR: default_web_client_id not found"
            find app/build -type f -name values.xml -print
            exit 1
          fi
          echo "$MATCH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: COD-Shoppy-Admin-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
